<!-- {% extends "meters/base.html" %}
{% load static %}

{% block title %}{% if is_edit %}แก้ไขสัญญา {{ contract_code }}{% else %}สร้างสัญญาใหม่{% endif %}{% endblock %}

{% block content %}
<div class="py-8">

  {# --- Heading + status badge --- #}
  <div class="flex items-center justify-between gap-4 flex-wrap mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        {% if is_edit %}แก้ไขสัญญา{% else %}สร้างสัญญาใหม่{% endif %}
      </h1>
      {% if is_edit %}
        <p class="text-sm text-gray-500 mt-1">เลขที่สัญญา <span class="font-medium text-gray-700">{{ contract_code }}</span></p>
      {% endif %}
    </div>
    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-600">
      {% if is_edit %}แก้ไขข้อมูล{% else %}ฉบับร่าง{% endif %}
    </span>
  </div>

  {# NOTE: หน้านี้เป็น UI เปล่ายังไม่เชื่อมกับ DB จริง -- ปุ่ม/ช่องกรอกยังไม่ทำงาน
     โหมดแก้ไข (is_edit=True) ยังไม่ดึงข้อมูลเดิมมาแสดงในช่องกรอกด้วยเช่นกัน
     ต้องเชื่อม DB ก่อนถึงจะ pre-fill ค่าเดิมของสัญญานั้นได้จริง #}
  <form class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    {# --- ฝั่งซ้าย: ข้อมูลสัญญา --- #}
    <div class="bg-white border border-gray-200 rounded-xl p-6">
      <h2 class="text-base font-bold text-gray-900 mb-1">ข้อมูลสัญญา</h2>
      <p class="text-xs text-gray-400 mb-5">กรอกข้อมูลที่มีเครื่องหมาย * ให้ครบถ้วน</p>

      <div class="grid grid-cols-2 gap-4">

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">ปีที่สร้างสัญญา *</label>
          <input type="number" placeholder="2569"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">รหัสลูกหนี้ *</label>
          <div class="relative">
            <svg class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/>
            </svg>
            <input type="text" placeholder="ค้นหารหัสลูกหนี้"
                   class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
          </div>
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">ชื่อลูกหนี้</label>
          <input type="text" placeholder="บริษัท ตัวอย่าง จำกัด"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">เลขประจำตัวผู้เสียภาษี</label>
          <input type="text" placeholder="0105559999999"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">เลขที่สัญญา</label>
          <input type="text" placeholder="ระบบสร้างให้อัตโนมัติ" disabled
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-400 cursor-not-allowed">
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">รหัสสัญญา *</label>
          <input type="text" placeholder="CTR-2569-0001"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">สถานที่ตั้ง *</label>
          <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <option>เลือกสถานที่ตั้ง</option>
          </select>
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Area</label>
          <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <option>เลือก Area</option>
          </select>
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">SubArea</label>
          <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <option>เลือก SubArea</option>
          </select>
        </div>

        <div class="col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">พื้นที่เช่าตามที่ต้องการ</label>
          <input type="text" placeholder="ระบุรายละเอียดพื้นที่"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

      </div>
    </div>

    {# --- ฝั่งขวา: ค่าใช้จ่าย มิเตอร์ และเอกสาร --- #}
    <div class="bg-white border border-gray-200 rounded-xl p-6">
      <h2 class="text-base font-bold text-gray-900 mb-5">ค่าใช้จ่าย มิเตอร์ และเอกสาร</h2>

      <div class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">ประเภทค่าใช้จ่าย *</label>
          <select class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <option>เลือกประเภทค่าใช้จ่าย</option>
            <option>ค่าน้ำประปา</option>
            <option>ค่าไฟฟ้า</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">เลขประจำตัวเครื่องวัดน้ำ/ไฟฟ้า</label>
          <input type="text" placeholder="ระบุเลขมิเตอร์"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">เลขอ่านครั้งก่อน / ครั้งหลัง</label>
          <div class="flex items-center gap-2">
            <input type="number" step="0.01" placeholder="0.00"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <svg class="w-4 h-4 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
            <input type="number" step="0.01" placeholder="0.00"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">วันที่อ่านเลขมิเตอร์</label>
          <input type="date"
                 class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">จำนวนหน่วยที่ต้องชำระ</label>
          <div class="relative">
            <input type="number" step="0.01" placeholder="0.00"
                   class="w-full border border-gray-200 rounded-lg px-3 py-2 pr-12 text-sm focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">บาท</span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">เอกสารประกอบ</label>
          <div class="border border-dashed border-gray-300 rounded-lg py-8 flex flex-col items-center justify-center text-center hover:border-brand-400 hover:bg-brand-50/30 transition-colors cursor-pointer">
            <svg class="w-6 h-6 text-gray-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9m0 0l-3 3m3-3l3 3M6 20.25h12A2.25 2.25 0 0020.25 18v-9a2.25 2.25 0 00-2.25-2.25H15l-1.5-2.25h-3L9 6.75H6A2.25 2.25 0 003.75 9v9A2.25 2.25 0 006 20.25z"/>
            </svg>
            <span class="text-sm text-gray-500">แนบไฟล์ 1-3 ไฟล์</span>
          </div>
        </div>

      </div>
    </div>

    {# --- Bottom actions --- #}
    <div class="lg:col-span-2 flex items-center justify-end gap-3 pt-2">
      <button type="button"
              class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 border border-gray-200 hover:bg-gray-50">
        ยกเลิก
      </button>
      <button type="button"
              class="px-5 py-2.5 rounded-lg text-sm font-medium text-brand-700 bg-brand-50 hover:bg-brand-100">
        บันทึกฉบับร่าง
      </button>
      <button type="button"
              class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-brand-500 hover:bg-brand-600">
        {% if is_edit %}บันทึกการแก้ไข{% else %}ส่งเรื่อง{% endif %}
      </button>
    </div>

  </form>

</div>
{% endblock %} -->
