{% extends "meters/base.html" %}
{% load static %}

{% block title %}ดาวน์โหลด Excel{% endblock %}

{% block content %}
<div class="py-8 max-w-xl mx-auto">

  <div class="text-sm text-gray-400 mb-1">
    <a href="{% url 'dashboard' %}" class="hover:text-brand-600">แดชบอร์ด</a>
    <span class="mx-1">›</span>
    <span class="text-gray-500">ดาวน์โหลด Excel</span>
  </div>

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">ดาวน์โหลด Excel</h1>
    <p class="text-sm text-gray-500 mt-1">เลือกเดือน-ปี เพื่อดาวน์โหลดรายชื่อสัญญาพร้อมเลขอ่านมิเตอร์น้ำ-ไฟของรอบบิลนั้น</p>
  </div>

  <form method="get" action="{% url 'download_excel' %}"
        class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">เดือน</label>
        <select name="month"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
          {% for m in thai_months %}
            <option value="{{ forloop.counter }}" {% if forloop.counter == billing_month %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">ปี</label>
        <select name="year"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-200 focus:border-brand-500">
          {% for y in year_options %}
            <option value="{{ y }}" {% if y == billing_year %}selected{% endif %}>{{ y }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <a href="{% url 'dashboard' %}"
         class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 border border-gray-200 hover:bg-gray-50">
        ยกเลิก
      </a>
      <button type="submit"
              class="px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-brand-500 hover:bg-brand-600">
        ดาวน์โหลด Excel
      </button>
    </div>
  </form>

</div>
{% endblock %}
