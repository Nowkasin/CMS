{% load static %}
<div class="overflow-hidden rounded-xl border border-gray-200 bg-white px-3 py-5 shadow-sm sm:px-8 sm:py-6">
  <div class="grid grid-cols-4">
    {% for label in step_labels %}
      {% with step_num=forloop.counter %}
      <div class="relative flex min-w-0 flex-col items-center px-1 text-center sm:px-3">
        {% if not forloop.last %}
          <div class="absolute left-[calc(50%+24px)] right-[calc(-50%+24px)] top-[18px] h-px {% if step_num < current_step %}bg-brand-400{% else %}bg-gray-200{% endif %}"></div>
        {% endif %}

        <div class="relative z-10 flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-semibold
                    {% if step_num < current_step %}bg-brand-500 text-white
                    {% elif step_num == current_step %}border-2 border-brand-500 bg-brand-50 text-brand-600
                    {% else %}bg-gray-100 text-gray-400{% endif %}">
          {% if step_num < current_step %}
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          {% else %}
            {{ step_num }}
          {% endif %}
        </div>

        <span class="mt-2 max-w-[150px] text-[11px] leading-4 sm:text-xs {% if step_num == current_step %}font-semibold text-brand-600{% else %}text-gray-400{% endif %}">
          {{ step_num }}. {{ label }}
        </span>
      </div>
      {% endwith %}
    {% endfor %}
  </div>
</div>
