{% load static %}
<div class="flex items-center mb-8">
  {% for label in step_labels %}
    {% with step_num=forloop.counter %}
    <div class="flex items-center {% if not forloop.last %}flex-1{% endif %}">
      <div class="flex flex-col items-center gap-2">
        <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-semibold shrink-0
                    {% if step_num < current_step %} bg-brand-500 text-white
                    {% elif step_num == current_step %} bg-brand-50 text-brand-600 border-2 border-brand-500
                    {% else %} bg-gray-100 text-gray-400 {% endif %}">
          {% if step_num < current_step %}
            <svg class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          {% else %}
            {{ step_num }}
          {% endif %}
        </div>
        <span class="text-xs whitespace-nowrap {% if step_num == current_step %} text-brand-600 font-semibold {% else %} text-gray-400 {% endif %}">
          {{ step_num }}. {{ label }}
        </span>
      </div>
      {% if not forloop.last %}
        <div class="flex-1 h-px mx-2 mb-5 {% if step_num < current_step %} bg-brand-400 {% else %} bg-gray-200 {% endif %}"></div>
      {% endif %}
    </div>
    {% endwith %}
  {% endfor %}
</div>
