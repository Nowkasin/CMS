{% load static %}<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: 'Prompt';
      src: url("{% static 'meters/webfonts/Prompt-Regular.ttf' %}") format('truetype');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Prompt';
      src: url("{% static 'meters/webfonts/Prompt-Medium.ttf' %}") format('truetype');
      font-style: normal;
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: 'Prompt';
      src: url("{% static 'meters/webfonts/Prompt-SemiBold.ttf' %}") format('truetype');
      font-style: normal;
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Prompt';
      src: url("{% static 'meters/webfonts/Prompt-Bold.ttf' %}") format('truetype');
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    /* ซ่อนปุ่มตาในตัวของ Edge/IE ไม่ให้ซ้อนกับปุ่มของเรา */
    #id_password::-ms-reveal,
    #id_password::-ms-clear { display: none; }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-[#e5f1ef] p-4 text-slate-900 sm:p-8" style="font-family: 'Prompt', sans-serif;">
  <main class="w-full max-w-[1180px] overflow-hidden rounded-[28px] bg-white shadow-2xl ring-1 ring-slate-900/5 lg:grid lg:grid-cols-[minmax(0,1fr)_clamp(360px,39%,460px)]">
    <section class="flex min-h-[280px] items-center justify-center bg-[#dff1ef] p-4 lg:min-h-0"
             aria-label="ขั้นตอนการบริหารสัญญา">
      <img src="{% static 'meters/images/cms-contract-flow.png' %}"
           alt="แผนภาพขั้นตอนระบบบริหารสัญญา CMS ตั้งแต่สร้างสัญญาถึงจัดพิมพ์สัญญา"
           class="block h-auto max-h-[450px] w-auto max-w-full"
           style="border-radius: 32px; clip-path: inset(1px round 31px);">
    </section>

    <section class="flex items-center justify-center bg-white my-10 px-6 py-10 sm:px-10 lg:min-h-0 lg:px-12 lg:py-[5px]">
      <div class="w-full max-w-sm">
        <div class="mb-9">
  
          <p class="mb-2 text-sm font-semibold uppercase tracking-[0.16em] text-[#087f78]">Contract Management System</p>
          <h1 class="text-3xl font-bold tracking-tight text-slate-900">เข้าสู่ระบบ</h1>
        </div>

        {% if form.errors %}
          <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-5 text-red-700" role="alert">
            Buasri ID หรือรหัสผ่านไม่ถูกต้อง หรือบัญชีนี้ยังไม่มีสิทธิ์เข้าใช้งาน
          </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-5">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div>
            <label for="id_username" class="mb-2 block text-sm font-semibold text-slate-700">Buasri ID</label>
            <input id="id_username" name="username" type="text" value="{{ form.username.value|default:'' }}"
                   autocomplete="username" autofocus required
                   class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-[#087f78] focus:ring-4 focus:ring-[#087f78]/10">
          </div>
          <div>
            <label for="id_password" class="mb-2 block text-sm font-semibold text-slate-700">รหัสผ่าน</label>
            {# ช่องรหัสผ่าน + ปุ่มตาเปิด/ปิด -- pr-12 กันตัวอักษรชนปุ่ม #}
            <div class="relative">
              <input id="id_password" name="password" type="password" autocomplete="current-password" required
                     class="w-full rounded-xl border border-slate-300 bg-white py-3 pl-4 pr-12 text-slate-900 outline-none transition focus:border-[#087f78] focus:ring-4 focus:ring-[#087f78]/10">
              <button type="button" id="togglePassword"
                      aria-label="แสดงรหัสผ่าน" aria-pressed="false" aria-controls="id_password"
                      title="แสดงรหัสผ่าน"
                      class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-r-xl text-slate-400 transition hover:text-[#087f78] focus:outline-none focus-visible:text-[#087f78] focus-visible:ring-4 focus-visible:ring-[#087f78]/10">
                {# ไอคอนตาเปิด: แสดงตอนรหัสผ่านถูกเปิดให้เห็นอยู่ (กดเพื่อซ่อน) #}
                <svg id="eyeOpen" class="hidden h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                {# ไอคอนตาขีดฆ่า: แสดงตอนรหัสผ่านถูกซ่อนอยู่ (กดเพื่อแสดง) #}
                <svg id="eyeClosed" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <button type="submit"
                  class="w-full rounded-xl bg-[#087f78] px-4 py-3.5 text-sm font-semibold text-white shadow-sm transition hover:bg-[#066a65] focus:outline-none focus:ring-4 focus:ring-[#087f78]/20">
            เข้าสู่ระบบ
          </button>
        </form>


      </div>
    </section>
  </main>

  <script>
    (function () {
      var input = document.getElementById('id_password');
      var btn = document.getElementById('togglePassword');
      var eyeOpen = document.getElementById('eyeOpen');
      var eyeClosed = document.getElementById('eyeClosed');
      if (!input || !btn) return;

      btn.addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eyeOpen.classList.toggle('hidden', !show);
        eyeClosed.classList.toggle('hidden', show);
        var label = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
        // คืนโฟกัสให้ช่องรหัสผ่าน พิมพ์ต่อได้ทันที และเคอร์เซอร์ไปท้ายข้อความ
        input.focus();
        var len = input.value.length;
        try { input.setSelectionRange(len, len); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
