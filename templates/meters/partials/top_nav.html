<header class="sticky top-0 z-40 flex min-h-16 w-full items-center border-b border-gray-200 bg-white px-5 py-3 shadow-sm sm:px-6">
  <a href="{% url 'meter_list' %}" class="flex items-center gap-3">
    <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-500 text-sm font-bold text-white">CMS</span>
    <span class="hidden sm:block">
      <span class="block text-sm font-semibold text-gray-900">ระบบบริหารสัญญา</span>
      <span class="block text-xs text-gray-400">Contract Management System</span>
    </span>
  </a>

  <div class="ml-auto flex items-center gap-3 pl-4">
    <div class="text-right leading-tight">
      <div class="text-xs text-gray-400">ผู้ใช้งาน</div>
      <div class="text-sm font-semibold text-gray-700">{{ request.session.cms_display_name|default:request.user.username }}</div>
    </div>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit"
              class="rounded-lg border border-gray-200 px-3 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50">
        ออกจากระบบ
      </button>
    </form>
  </div>
</header>
